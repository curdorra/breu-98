      <div><span class="lbl">Temp</span><span class="v num" id="p-temp"></span></div>
      <div><span class="lbl">Time</span><span class="v num" id="p-time"></span></div>
      <div><span class="lbl">Ratio</span><span class="v num" id="p-ratio"></span></div>
    </div>
    <div class="params" style="margin-top:10px; padding-top:8px; border-top:1px dotted var(--sh);">
      <div><span class="lbl">Body</span><span id="p-body"></span></div>
      <div><span class="lbl">Clarity</span><span id="p-clarity"></span></div>
      <div><span class="lbl">Technique</span><span id="p-sens"></span></div>
    </div>
  </fieldset>
  <div class="grid2">
    <div><label class="lbl" for="dose">Coffee dose (g)</label><input class="field" type="number" id="dose" inputmode="decimal" value="15" min="1" max="2000"></div>
    <div><label class="lbl" for="ratio">Ratio (1 : x)</label><input class="field" type="number" id="ratio" inputmode="decimal" value="16" min="1" max="100"></div>
  </div>
  <div class="grid2" style="margin-top:12px;">

    <button class="btn" id="open-brews"><span data-ico="folder"></span>My Brews</button>
  </div>
  <button class="acc" id="guide-btn" aria-expanded="false" aria-controls="guide-body"><span class="pm"></span>Step-by-step guide</button>

<template id="t-fix">
  <h3 class="px">Taste Troubleshooter</h3>
  <p class="sub">Describe your cup and get targeted fixes.</p>
  <div class="sym-grid" id="sym-chips" role="group" aria-label="Symptom"></div>
  <fieldset class="grp"><legend>Extraction</legend>
    <div class="spec-legend" style="margin:0 0 12px; font-family:var(--px); font-size:12px;"><span>Under</span><span>Ideal</span><span>Over</span></div>
    <div class="spec"><div class="spec-fill"></div><div class="spec-thumb" id="spec-thumb"></div></div>
    <div class="spec-legend"><span>sour · thin</span><span>sweet · balanced</span><span>bitter · dry</span></div>
  </fieldset>
  <div class="sunk" id="fix-result" hidden>
    <span class="lbl" id="fix-tag"></span>
    <h3 class="px" id="fix-cause" style="margin:2px 0 6px;"></h3>
    <p class="why" id="fix-science" style="margin-bottom:12px;"></p>
    <ul class="tips" id="fix-list"></ul>
  </div>
  <p class="empty" id="fix-hint">Select a symptom above to diagnose your brew.</p>
</template>

<template id="t-measure">
  <h3 class="px">Extraction Yield</h3>
  <p class="sub">Quantify your brew with refractometer and dose data.</p>
  <fieldset class="grp"><legend>What you're measuring</legend>
    <p><b>TDS (Total Dissolved Solids)</b> is the percentage of your beverage that is dissolved coffee compounds — measured with a refractometer. A reading of 1.35% means 1.35 g of solids per 100 g of liquid.</p>
    <p style="margin-top:8px;"><b>Extraction Yield</b> tells you what fraction of the coffee's dry mass ended up in the cup. EY% = TDS% × beverage mass ÷ coffee dose. The SCA target for filter coffee is 18–22%.</p>
  </fieldset>
  <div class="grid3">
    <div><label class="lbl" for="ey-tds">TDS %</label><input class="field" type="number" id="ey-tds" inputmode="decimal" step="0.01" placeholder="1.35"></div>
    <div><label class="lbl" for="ey-dose">Dose (g)</label><input class="field" type="number" id="ey-dose" inputmode="decimal" placeholder="15"></div>
    <div><label class="lbl" for="ey-bev">Beverage (g)</label><input class="field" type="number" id="ey-bev" inputmode="decimal" placeholder="240"></div>
  </div>
  <div class="lcd" style="margin-top:12px; display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;">
    <div><span class="lbl">Extraction Yield</span><div class="big" id="ey-val">—</div></div>
    <div id="ey-verdict" hidden style="margin-bottom:6px;"><span class="badge" id="ey-badge"></span><div class="unit" id="ey-note" style="margin-top:4px;"></div></div>
  </div>
  <div style="margin-top:16px;">
    <div class="spec"><div class="spec-fill"></div><div class="spec-thumb" id="ey-thumb"></div></div>
    <div class="spec-legend"><span>14%</span><span>18%</span><span>22%</span><span>26%</span></div>
  </div>
  <fieldset class="grp" style="margin-top:16px;"><legend>Using a refractometer</legend>
    <ol class="steps">
      <li><span class="n">01</span><span>Let your brew cool to room temperature (or at least below 45 °C) before sampling. Heat changes the refractive index and skews readings.</span></li>
      <li><span class="n">02</span><span>Calibrate with distilled water first — the reading should be 0.00%. Temperature-compensating (ATC) models handle this automatically.</span></li>
      <li><span class="n">03</span><span>Place 2–3 drops on the prism. Close the cover, wait 30 s, then read. Coffee refractometers read in Brix — multiply by 0.85 for approximate TDS%.</span></li>
      <li><span class="n">04</span><span>Take 2–3 readings and average them. A dedicated coffee refractometer (VST, Atago) gives direct TDS% without conversion.</span></li>
    </ol>
  </fieldset>
  <fieldset class="grp chart"><legend>Brewing Control Chart</legend>
    <div class="sunk" style="padding:8px;">
    <svg viewBox="0 0 380 260" role="img" aria-label="Brewing Control Chart — X: TDS strength, Y: extraction yield" style="font-family:VT323,monospace;">
      <g stroke="var(--sh)" stroke-width="1" shape-rendering="crispEdges">
        <line x1="52" y1="16" x2="52" y2="228" stroke="var(--sh-dk)"/><line x1="52" y1="228" x2="372" y2="228" stroke="var(--sh-dk)"/>
        <line x1="52" y1="87" x2="372" y2="87" stroke-dasharray="2,3"/><line x1="52" y1="157" x2="372" y2="157" stroke-dasharray="2,3"/>
        <line x1="132" y1="16" x2="132" y2="228" stroke-dasharray="2,3"/><line x1="212" y1="16" x2="212" y2="228" stroke-dasharray="2,3"/><line x1="292" y1="16" x2="292" y2="228" stroke-dasharray="2,3"/>
      </g>
      <g font-size="13" fill="var(--text2)" text-anchor="end">
        <text x="46" y="20">26%</text><text x="46" y="90">22%</text><text x="46" y="160">18%</text><text x="46" y="231">14%</text>
      </g>
      <g font-size="13" fill="var(--text2)" text-anchor="middle">
        <text x="52" y="242">0.8</text><text x="132" y="242">1.0</text><text x="212" y="242">1.2</text><text x="292" y="242">1.4</text><text x="372" y="242">1.6</text>
        <text x="212" y="257">Strength (TDS %)</text>
        <text x="14" y="124" transform="rotate(-90 14 124)">Extraction Yield %</text>
      </g>
      <rect x="192" y="87" width="120" height="70" fill="var(--ideal)" fill-opacity=".14" stroke="var(--ideal)" stroke-dasharray="4,3" shape-rendering="crispEdges"/>
      <text x="252" y="127" text-anchor="middle" font-size="14" fill="var(--ideal)" letter-spacing="2">IDEAL</text>
      <g id="chart-dot" opacity="0" shape-rendering="crispEdges" fill="var(--over)" stroke="var(--sh-dk)" stroke-width=".6">
        <path d="M-6 -4h4v-2h4v2h4v4h-2v2h-2v2h-2v2h-2v-2h-2v-2h-2v-2h-2z"/>
      </g>
    </svg>
    </div>
    <div class="grid2" style="margin-top:10px;">
      <div><span class="lbl">Filter coffee</span>EY 18–22% · TDS 1.15–1.45%</div>
      <div><span class="lbl">Espresso</span>EY 18–22% · TDS 8–12%</div>
    </div>
  </fieldset>
  <p class="muted" style="text-align:center; font-size:11px;">Targets after SCA Golden Cup guidelines · EY% = TDS% × beverage mass ÷ coffee dose</p>
